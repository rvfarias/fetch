apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parcelepag-service-hml
  namespace: argocd-lab
spec:
  project: env-linkpagamento-hml
  source:
    repoURL: 'https://gitlab.app.rpe.tech/infraestrutura/argo-cd/argocd-rpe-legado.git'
    path: helm-charts/autorizacao/linkpagamento/parcelepag-service
    targetRevision: hml
  destination:
    server: 'https://CA39D4383334BE87B1732E23111FF190.gr7.us-east-1.eks.amazonaws.com'
    namespace: linkpagamento-hml
  syncPolicy:
    automated:
        prune: true
        selfHeal: true
        allowEmpty: true
    syncOptions:
    - PrunePropagationPolicy=foreground
    - CreateNamespace=true
    - PruneLast=true
    retry:
        limit: 5
        backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m


