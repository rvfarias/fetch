replicaCount: 2

applicationName: cardsapi-v2
namespace: cards-api-v2-qa

nodeSelector:
  environment: cardsapi-generics

initContainers:
  enabled: false
  config:
  - name: wait-for-other-pod
    image: curlimages/curl
    args:
    - /bin/sh
    - -c
    - >
      set -x;
      while [ $(curl -sw '%{http_code}' "web-configuration:8888/actuator/health" -o /dev/null) -ne 200 ]; do
        sleep 10;
      done

image:
  repository:  261177153744.dkr.ecr.us-east-1.amazonaws.com/cards/cards_api
  pullPolicy: IfNotPresent
  tag: "RELEASE-1.8.41-5bb1de0f"

resources:
  limits:
    cpu: 1500m
    memory: 1500Mi
  requests:
    cpu: 500m
    memory: 1000Mi

service:
  type: ClusterIP
  port: 8080

healthCheck:
  readiness:
    enabled: true
    initialDelaySeconds: 60
    timeoutSeconds: 5
    periodSeconds: 5
    httpGet:
      enabled: false
      path: /api/actuator/health
    tcpSocket:
      enabled: true
  liveness:
    enabled: false
    initialDelaySeconds: 150
    timeoutSeconds: 5
    periodSeconds: 5
    httpGet:
      enabled: false
      path: /actuator/health
    tcpSocket:
      enabled: false

persistence:
  enabled: true
  mounts:
    - name: chaves
      mountPath: /usr/local/Chaves
    - name: gtkpdf
      mountPath: /usr/lib/gtkpdf-1.2
    - name: certificados
      mountPath: /usr/local/certificados

  volumes:
    - name: chaves
      nfs:
        server: 10.232.64.34
        path: /Chaves
    - name: certificados
      nfs:
        server: 10.232.64.34
        path: /certificados
    - name: gtkpdf
      nfs:
        server: 10.232.64.34
        path: /gtkpdf-1.2


configmaps:
  enabled: true
  envs:
    SPRING_PROFILES_ACTIVE: tcardsapi
    BANCO_URL: jdbc:oracle:thin:@10.50.3.156:1521:dbteste
    BANCO_USUARIO: tcards_api
    BANCO_SENHA: tcards_api.mktpay

ingress:
  enabled: true
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:138511992678:certificate/14f241ee-6dc9-4a70-860e-d1e891f63ab6,arn:aws:acm:us-east-1:138511992678:certificate/908ad1e4-db79-42cf-ab77-c22938424eea
    alb.ingress.kubernetes.io/group.name: lab-rpe-int
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-FS-1-2-Res-2020-10
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/target-type: ip
    kubernetes.io/ingress.class: alb
  host: cards-api-v2.testing.prc.rpe.tech
  path: /cards-api
  pathtype: Prefix

hpa:
  enabled: false
  scaling:
    minReplicas: 5
    maxReplicas: 8
  cpu:
    enabled: false
    averageUtilization: 80
  memory:
    enabled: false
    averageUtilization: 80
